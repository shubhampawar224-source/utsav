{% extends 'admin/base_admin.html' %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col-lg-6 mb-4">
            <div class="card admin-card p-3">
                <h5 class="mb-3">Add Product</h5>
                <form action="/admin/manage/products/create" method="post" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input class="form-control" type="text" name="name" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Price (INR)</label>
                        <input class="form-control" type="number" step="0.01" name="price" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Category</label>
                        <input class="form-control" type="text" name="category">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" name="description" rows="4"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Image</label>
                        <input class="form-control" type="file" name="image" accept="image/*">
                    </div>
                    <button class="btn btn-success" type="submit">Upload Product</button>
                </form>
            </div>
        </div>
        <div class="col-lg-6 mb-4">
            <div class="card admin-card p-3">
                <h5 class="mb-3">Existing Products</h5>
                <div class="list-group">
                    {% for p in products %}
                    <div class="list-group-item d-flex justify-content-between align-items-center">
                        <div>
                            <strong>{{ p.name }}</strong><br>
                            <small class="text-muted">₹{{ '%.2f'|format(p.price) }} · {{ p.category }}</small>
                        </div>
                        <div class="d-flex gap-2">
                            <a class="btn btn-sm btn-outline-primary" href="/product/{{ p.id }}">View</a>
                            <a class="btn btn-sm btn-outline-secondary"
                                href="/admin/manage/products/edit/{{ p.id }}">Edit</a>
                            <form method="post" action="/admin/manage/products/delete/{{ p.id }}"
                                onsubmit="return confirm('Delete this product?');">
                                <button class="btn btn-sm btn-outline-danger" type="submit">Delete</button>
                            </form>
                        </div>
                    </div>
                    {% else %}
                    <div class="list-group-item">No products yet.</div>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
