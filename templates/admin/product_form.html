{% extends 'admin/base_admin.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h3>{{ 'Edit Product' if product else 'Add Product' }}</h3>
    <a class="btn btn-outline-secondary" href="/admin/manage/products">Back to Products</a>
</div>

<div class="card admin-card p-3">
    {% if product %}
    <form method="post" action="/admin/manage/products/edit/{{ product.id }}" enctype="multipart/form-data">
        {% else %}
        <form method="post" action="/admin/manage/products/create" enctype="multipart/form-data">
            {% endif %}
            <div class="mb-3">
                <label class="form-label">Name</label>
                <input name="name" class="form-control" value="{{ product.name if product else '' }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Price (INR)</label>
                <input name="price" type="number" step="0.01" class="form-control"
                    value="{{ product.price if product else '' }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Category</label>
                <input name="category" class="form-control" value="{{ product.category if product else '' }}">
            </div>
            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea name="description" class="form-control"
                    rows="3">{{ product.description if product else '' }}</textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Image (optional)</label>
                <input type="file" name="image" class="form-control">
                {% if product and product.image_filename %}
                <div class="mt-2"><img src="/static/uploads/{{ product.image_filename }}"
                        style="height:80px; object-fit:contain"></div>
                {% endif %}
            </div>
            <button class="btn btn-primary">Save</button>
        </form>
</div>
{% endblock %}
