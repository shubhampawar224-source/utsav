{% extends 'admin/base_admin.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <a class="btn btn-outline-secondary" href="/admin/manage">Dashboard</a>
</div>

<div class="card admin-card">
    <div class="table-responsive">
        <table class="table table-sm mb-0">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Joined</th>
                </tr>
            </thead>
            <tbody>
                {% for u in users %}
                <tr>
                    <td>{{ u.id }}</td>
                    <td>{{ u.name }}</td>
                    <td>{{ u.email }}</td>
                    <td>{{ u.phone or '-' }}</td>
                    <td>{{ u.created_at.strftime('%Y-%m-%d') }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

{% endblock %}
