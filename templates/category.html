<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ category }} - Electronics Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">Electronics Shop</a>
        </div>
    </nav>
    <main class="container">
        <div class="row mb-3">
            <div class="col-12 d-flex justify-content-between align-items-center">
                <div>
                    <h2 class="mb-0">{{ category }}</h2>
                    <p class="text-muted mb-0">Showing featured deals for <strong>{{ category }}</strong></p>
                </div>
                <div>
                    <button id="viewAllBtn" class="btn btn-outline-primary">View all</button>
                </div>
            </div>
        </div>

        <div class="mb-4">
            <div id="featuredScroller" class="featured-scroller"></div>
        </div>

        <div id="products" class="row g-4">
            <!-- products injected by JS -->
        </div>

        <nav class="mt-4">
            <ul id="pagination" class="pagination justify-content-center"></ul>
        </nav>
    </main>

    <script src="/static/js/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // set the currentCategory from template variable
            window.currentCategory = {{ category | tojson }
        };
        });
    </script>
</body>

</html>
