<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Product - Electronics Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">Electronics Shop</a>
        </div>
    </nav>
    <main class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <h3 class="mb-3">Edit Product</h3>
                <form action="/admin/edit/{{ product.id }}" method="post" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input class="form-control" type="text" name="name" value="{{ product.name }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Price (INR)</label>
                        <input class="form-control" type="number" step="0.01" name="price"
                            value="{{ '%.2f'|format(product.price) }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Category</label>
                        <input class="form-control" type="text" name="category" value="{{ product.category }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" name="description" rows="4">{{ product.description }}</textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Replace Image (optional)</label>
                        <input class="form-control" type="file" name="image" accept="image/*">
                    </div>
                    <button class="btn btn-primary" type="submit">Save Changes</button>
                    <a class="btn btn-secondary ms-2" href="/admin">Cancel</a>
                </form>
            </div>
        </div>
    </main>
</body>

</html>
