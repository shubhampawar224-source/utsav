<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Electronics Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">Electronics Shop</a>
            <div class="d-flex">
                <a class="btn btn-outline-light me-2" href="/admin">Admin</a>
            </div>
        </div>
    </nav>

    <main class="container">
        <div class="row mb-3">
            <div class="col-md-6">
                <input id="searchInput" class="form-control" placeholder="Search products (name or description)">
            </div>
            <div class="col-md-3">
                <select id="categoryFilter" class="form-select">
                    <option value="">All categories</option>
                </select>
            </div>
            <div class="col-md-3 text-end">
                <small id="resultsInfo" class="text-muted"></small>
            </div>
        </div>

        <div id="products" class="row g-4">
            <!-- products injected by JS -->
        </div>

        <nav class="mt-4">
            <ul id="pagination" class="pagination justify-content-center"></ul>
        </nav>
    </main>

    <script src="/static/js/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
