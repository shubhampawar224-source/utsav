<section class="latest-products my-5">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="mb-0">Latest Products</h5>
        </div>

        <div class="row g-3">
            {% for p in latest_products %}
            <div class="col-12 col-md-4">
                {% if p %}
                <div class="card product-card h-100">
                    <div class="card-img-wrap"><img src="{{ p.image_url }}" alt="{{ p.name }}"></div>
                    <div class="card-body d-flex flex-column">
                        <h6 class="card-title">{{ p.name }}</h6>
                        <p class="mb-2 text-muted small">{{ p.description or '' }}</p>
                        <div class="d-flex justify-content-between align-items-center mt-auto">
                            <span class="price-badge">{{ p.price_display }}</span>
                            <a class="btn btn-sm btn-primary" href="/product/{{ p.id }}">View</a>
                        </div>
                    </div>
                </div>
                {% else %}
                <div class="card product-card h-100">
                    <img src="https://via.placeholder.com/400x300?text=Coming+Soon" class="card-img-top"
                        alt="placeholder">
                    <div class="card-body d-flex flex-column">
                        <h6 class="card-title">Coming soon</h6>
                        <p class="mb-2 text-muted small">We will add products shortly.</p>
                        <div class="d-flex justify-content-between align-items-center mt-auto">
                            <span class="price-badge">&nbsp;</span>
                            <a class="btn btn-sm btn-secondary disabled" href="#">View</a>
                        </div>
                    </div>
                </div>
                {% endif %}
            </div>
            {% endfor %}
        </div>
    </div>
</section>
