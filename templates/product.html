<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ product.name }} - Electronics Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">Electronics Shop</a>
        </div>
    </nav>
    <main class="container">
        <div class="row">
            <div class="col-md-5">
                {% if product.image_filename %}
                <img src="/static/uploads/{{ product.image_filename }}" class="img-fluid rounded"
                    alt="{{ product.name }}">
                {% else %}
                <div class="placeholder-img">No Image</div>
                {% endif %}
            </div>
            <div class="col-md-7">
                <h1>{{ product.name }}</h1>
                <h3 class="text-success">${{ '%.2f'|format(product.price) }}</h3>
                <p class="text-muted">Category: <span class="badge bg-primary">{{ product.category or 'General'
                        }}</span></p>
                <p>{{ product.description }}</p>
                <a class="btn btn-outline-primary" href="/">Back to shop</a>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
